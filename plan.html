*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:none;margin:0 auto;display:grid;gap:14px}
h1{margin:0;font-size:clamp(22px,3vw,30px);line-height:1.25;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:90ch}
.eyebrow{font-family:var(--m);font-size:12px;letter-spacing:.06em;color:var(--pool);text-transform:uppercase}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg b{font-size:12px;color:var(--muted);font-weight:500;padding:4px 6px}
button{font:inherit;font-size:13.5px;color:var(--ink);background:transparent;border:0;border-radius:7px;padding:6px 11px;cursor:pointer}
button:hover{background:var(--chip)}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.main{display:grid;grid-template-columns:1fr;gap:14px}
.plan{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.zoom #zPct{font:600 12px var(--f);text-align:center;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px 0;min-width:34px}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px 6px;min-width:0}
.sec h3{margin:0 0 2px;font-size:15px}.sec p{margin:0 0 6px;color:var(--muted);font-size:12.5px}
.sec svg{display:block;width:100%;height:auto}
.sec .hit{stroke:transparent;fill:none;cursor:help}
.plan svg{display:block;width:100%;height:max(560px,calc(100vh - 32px));touch-action:none;cursor:grab}
.plan svg.drag{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:4px;z-index:2}
.zoom button{width:34px;height:34px;padding:0;font-size:18px;background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zhint{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);background:var(--paper);padding:2px 8px;border-radius:6px;opacity:.9}
.side{display:grid;gap:12px;align-content:start;min-width:0;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h3{margin:0 0 6px;font-size:15px}
.card p{margin:0;color:var(--muted)}
.leg{display:grid;gap:6px;font-size:13px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:26px;height:4px;border-radius:2px;flex:none}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nums div{background:var(--chip);border-radius:9px;padding:8px 10px}
.nums b{display:block;font-family:var(--m);font-size:17px;font-variant-numeric:tabular-nums}
.nums span{font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
/* svg */
.ar{fill:none;stroke:var(--ar);stroke-width:.7}
.arw{fill:none;stroke:var(--arw);stroke-width:1}
.wf{fill:var(--ink);opacity:.62}
.grid{stroke:var(--line);stroke-width:.8;stroke-dasharray:10 4 2 4;fill:none}
.gb circle{fill:var(--paper);stroke:var(--muted)}
.gb text{font-family:var(--m);font-size:12px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.pipe{fill:none;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:#fff;stroke-linecap:round;stroke-dasharray:1 12;opacity:.95;animation:run var(--dur,1.8s) linear infinite}
@keyframes run{to{stroke-dashoffset:-52}}
.paused .flow{animation-play-state:paused}
.lbl{font-family:var(--f);font-size:11.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.lsub{font-family:var(--m);font-size:10px;fill:var(--muted);paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.eq{cursor:pointer}
.eq .shape{stroke-width:1}
.eq.hid .shape{stroke-dasharray:4 3}
.eq:hover .shape,.eq.on .shape{stroke:var(--sel);stroke-width:2.2}
.layer{transition:opacity .35s}
.off{opacity:0;pointer-events:none}
.dimm{opacity:.18}
@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:3 5}}

; --chem:#a988e0; --waste:#b08f78; --chip:#14303a; --grid:#17323b; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.6;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}\n.wrap{max-width:1240px;margin:0 auto;display:grid;gap:22px}\nheader h1{font-size:clamp(24px,3.4vw,36px);line-height:1.25;margin:0;font-weight:700;text-wrap:balance}\nheader p{margin:6px 0 0;color:var(--muted);max-width:72ch}\n.tag{display:inline-block;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}\n.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}\n.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}\n.modes button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}\n.modes button[aria-pressed=\"true\"]{background:var(--teal);border-color:var(--teal);color:#fff}\n.modes button:focus-visible,.ctl input:focus-visible{outline:2px solid var(--warm);outline-offset:2px}\n.diagram{overflow-x:auto}\n.diagram svg{display:block;width:100%;min-width:760px;height:auto}\n.caption{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:10px}\n.caption .now{flex:1 1 380px;min-width:0}\n.caption h3{margin:0 0 4px;font-size:17px}\n.caption p{margin:0;color:var(--muted)}\n.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}\n.legend i{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}\n.scale{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}\n.scale span.bar{width:140px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--cool),var(--warm),var(--hot))}\n\n/* svg */\n.lbl{font-family:var(--f-text);font-size:13px;fill:var(--ink);font-weight:600}\n.sub{font-family:var(--f-text);font-size:11px;fill:var(--muted)}\n.num{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}\n.box{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}\n.pipe{fill:none;stroke:var(--pipe);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}\n.pipe.thin{stroke-width:4}\n.flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 15;opacity:0;transition:opacity .4s}\n.flow.on{opacity:1;animation:run var(--dur,2.4s) linear infinite}\n@keyframes run{to{stroke-dashoffset:-64}}\n.dim{opacity:.35;transition:opacity .4s}\n.hp-glow{opacity:0;transition:opacity .5s}\n.heat .hp-glow{opacity:1}\n.chipT rect{fill:var(--surface);stroke:var(--line)}\n.chipT text{font-family:var(--f-mono);font-size:12px;font-weight:600}\n.waterlevel{transition:y .9s ease,height .9s ease}\n@media (prefers-reduced-motion:reduce){.flow.on{animation:none;stroke-dasharray:6 6}}\n\n/* cards */\n.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}\n@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media (max-width:560px){.steps{grid-template-columns:1fr}}\n.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start;min-width:0}\n.step .k{font-family:var(--f-mono);font-size:12px;color:var(--teal);letter-spacing:.05em}\n.step h4{margin:0;font-size:16px}\n.step p{margin:0;font-size:14px;color:var(--muted)}\n.step .fig{font-family:var(--f-mono);font-size:13px;color:var(--ink);background:var(--chip);border-radius:8px;padding:6px 8px}\nh2{font-size:21px;margin:0 0 4px}\n.lead{color:var(--muted);margin:0 0 12px;max-width:80ch}\n\n/* chart */\n.chartgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}\n@media (max-width:860px){.chartgrid{grid-template-columns:1fr}}\n.ctl{display:grid;gap:14px;align-content:start}\n.ctl label{display:grid;gap:4px;font-size:14px}\n.ctl output{font-family:var(--f-mono);font-weight:600;color:var(--warm)}\n.ctl input[type=range]{width:100%;accent-color:var(--teal)}\n.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.kpi{background:var(--chip);border-radius:10px;padding:10px}\n.kpi b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}\n.kpi span{font-size:12px;color:var(--muted)}\n#chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}\n.note{font-size:13px;color:var(--muted);margin:10px 0 0}\n.tline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin-top:6px}\n.track+.tline .tnode{padding-top:2px}\n@media (max-width:700px){.tline{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:8px}.track{display:none}}\n.tnode{text-align:center;font-size:12px;color:var(--muted);min-width:0}\n.tnode b{display:block;font-family:var(--f-mono);font-size:16px}\n\n/* v2: แถบหัวเรื่องลายน้ำ + ตัวเลขหลัก + ขั้นตอนต่อเนื่อง + รางอุณหภูมิ */\n.hero{position:relative;overflow:hidden;border-radius:18px;padding:26px 24px 22px;background:\n  radial-gradient(120% 140% at 100% 0%, color-mix(in srgb,var(--warm) 22%, transparent) 0%, transparent 55%),\n  linear-gradient(135deg, color-mix(in srgb,var(--water-edge) 92%, #000) 0%, var(--water-edge) 55%, color-mix(in srgb,var(--teal) 85%, #000) 100%);color:#fff}\n.hero::after{content:\"\";position:absolute;inset:auto -10% -40px -10%;height:90px;background:\n  repeating-radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.10) 0 2px, transparent 2px 18px);pointer-events:none}\n.hero .tag{color:#d6f3f1}\n.hero h1{color:#fff}\n.hero p{color:rgba(255,255,255,.86)}\n.stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:18px}\n@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 12px;backdrop-filter:blur(4px);min-width:0}\n.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}\n.stat span{font-size:12px;color:rgba(255,255,255,.8)}\n.steps{counter-reset:st}\n.step{position:relative;padding-top:18px}\n.step .k{display:flex;align-items:center;gap:8px}\n.step .k::before{counter-increment:st;content:counter(st);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;\n  background:var(--teal);color:#fff;font-weight:600;font-size:13px;flex:none}\n.step:nth-child(6) .k::before{background:var(--warm)}\n.step:nth-child(5) .k::before{background:var(--chem)}\n.track{position:relative;height:10px;border-radius:5px;margin:22px 4% 6px;background:linear-gradient(90deg,var(--cool) 0%,var(--cool) 55%,var(--warm) 88%,var(--hot) 100%)}\n.track i{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}\n<\/style>\n\n<div class=\"wrap\">\n<header class=\"hero\">\n  <div class=\"tag\">Riser diagram · ร่างเสนอตรวจ · อาคารวารีบำบัด เทศบาลนครตรัง<\/div>\n  <h1>ระบบหมุนเวียน กรอง ฆ่าเชื้อ และอุ่นน้ำ สระวารีบำบัด<\/h1>\n  <p>สระ 7.00 × 13.50 ม. ลึก 1.40 ม. รางน้ำล้นรอบสระ น้ำหมุนเวียนต่อเนื่องผ่านถังกรอง ยูวี และปั๊มความร้อน เลือกโหมดในแผนผังเพื่อดูทิศการไหลของแต่ละสถานการณ์<\/p>\n  <div class=\"stats\">\n    <div class=\"stat\"><b>146 ลบ.ม.<\/b><span>ปริมาตรน้ำในสระ<\/span><\/div>\n    <div class=\"stat\"><b>1.5 ชม.<\/b><span>หมุนเวียนครบ 1 รอบ<\/span><\/div>\n    <div class=\"stat\"><b>98 ลบ.ม./ชม.<\/b><span>อัตราหมุนเวียน<\/span><\/div>\n    <div class=\"stat\"><b>33.5 °C<\/b><span>อุณหภูมิน้ำออกแบบ<\/span><\/div>\n    <div class=\"stat\"><b>2 × 15 kW<\/b><span>ปั๊มความร้อน<\/span><\/div>\n  <\/div>\n<\/header>\n\n<section class=\"panel\" aria-label=\"แผนผังการไหล\">\n  <div class=\"modes\" role=\"group\" aria-label=\"โหมดการทำงาน\">\n    <button data-mode=\"run\" aria-pressed=\"true\">กรองหมุนเวียน + อุ่นน้ำ<\/button>\n    <button data-mode=\"bathers\" aria-pressed=\"false\">มีผู้ใช้ลงสระ<\/button>\n    <button data-mode=\"makeup\" aria-pressed=\"false\">เติมน้ำ<\/button>\n    <button data-mode=\"backwash\" aria-pressed=\"false\">ล้างย้อนถังกรอง<\/button>\n    <button data-mode=\"idle\" aria-pressed=\"false\">ปั๊มหยุด<\/button>\n  <\/div>\n  <div class=\"diagram\">\n  <svg id=\"sys\" viewBox=\"0 0 1200 640\" role=\"img\" aria-label=\"แผนผังระบบน้ำสระวารีบำบัด\">\n    <defs>\n      <linearGradient id=\"tGrad\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"var(--cool)\"/><stop offset=\"1\" stop-color=\"var(--warm)\"/><\/linearGradient>\n      <radialGradient id=\"glow\"><stop offset=\"0\" stop-color=\"var(--hot)\" stop-opacity=\".55\"/><stop offset=\"1\" stop-color=\"var(--hot)\" stop-opacity=\"0\"/><\/radialGradient>\n      <marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--muted)\"/><\/marker>\n    <\/defs>\n    <!-- ระดับพื้น -->\n    <line x1=\"10\" y1=\"252\" x2=\"1190\" y2=\"252\" stroke=\"var(--line)\" stroke-dasharray=\"6 6\"/>\n    <text class=\"num\" x=\"440\" y=\"246\">±0.00 พื้นโถงสระ<\/text>\n    <rect x=\"455\" y=\"300\" width=\"725\" height=\"320\" rx=\"10\" fill=\"none\" stroke=\"var(--line)\" stroke-dasharray=\"4 6\"/>\n    <text class=\"sub\" x=\"590\" y=\"318\">ห้องเครื่องสระ (ทางเลือก ค1)<\/text>\n\n    <!-- สระ -->\n    <g id=\"pool\">\n      <rect x=\"40\" y=\"252\" width=\"360\" height=\"170\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"1.6\"/>\n      <rect id=\"poolWater\" x=\"44\" y=\"262\" width=\"352\" height=\"156\" fill=\"var(--water)\"/>\n      <rect x=\"40\" y=\"252\" width=\"14\" height=\"14\" fill=\"var(--pipe)\"/><rect x=\"386\" y=\"252\" width=\"14\" height=\"14\" fill=\"var(--pipe)\"/>\n      <text class=\"lbl\" x=\"220\" y=\"300\" text-anchor=\"middle\">สระวารีบำบัด 146 ลบ. ta-k=\"bw\" data-c=\"var(--waste)\" d=\"M820 382 V600 H1040\"/>\n      <path class=\"flow\" data-k=\"bw\" data-c=\"var(--waste)\" d=\"M912 382 V600\"/>\n      <path class=\"flow\" data-k=\"bwin\" data-t=\"33.3\" d=\"M736 445 H760 V200 H820\"/>\n      <path class=\"flow\" data-k=\"cd\" data-c=\"var(--chem)\" d=\"M1132 150 V118 H1186\"/>\n    <\/g>\n\n    <!-- ถังพักน้ำล้น -->\n    <g>\n      <rect x=\"470\" y=\"390\" width=\"92\" height=\"200\" class=\"box\" rx=\"6\"/>\n      <rect id=\"btWater\" class=\"waterlevel\" x=\"473\" y=\"470\" width=\"86\" height=\"117\" fill=\"var(--water)\"/>\n      <text class=\"lbl\" x=\"516\" y=\"420\" text-anchor=\"middle\">BT<\/text>\n      <text class=\"sub\" x=\"516\" y=\"436\" text-anchor=\"middle\">ถังพักน้ำล้น<\/text>\n      <text class=\"num\" x=\"516\" y=\"452\" text-anchor=\"middle\">7 ลบ.ม.<\/text>\n      <text class=\"sub\" x=\"516\" y=\"610\" text-anchor=\"middle\">ฝังใต้พื้นห้องเครื่อง<\/text>\n    <\/g>\n    <!-- ประปาเติม -->\n    <g>\n      <rect x=\"480\" y=\"16\" width=\"80\" height=\"54\" class=\"box\" rx=\"6\"/>\n      <text class=\"lbl\" x=\"520\" y=\"40\" text-anchor=\"middle\">ถังน้ำประปา<\/text>\n      <text class=\"num\" x=\"520\" y=\"58\" text-anchor=\"middle\">1\" ลูกลอย<\/text>\n      <line x1=\"508\" y1=\"171\" x2=\"532\" y2=\"171\" stroke=\"var(--muted)\"/><text class=\"num\" x=\"540\" y=\"175\">ช่องว่างอากาศ<\/text>\n    <\/g>\n    <!-- HS -->\n    <g><rect x=\"618\" y=\"480\" width=\"48\" height=\"50\" class=\"box\" rx=\"6\"/><text class=\"lbl\" x=\"642\" y=\"510\" text-anchor=\"middle\">HS<\/text>\n      <text class=\"sub\" x=\"642\" y=\"548\" text-anchor=\"middle\">ตะแกรงดักผม<\/text><\/g>\n    <!-- ปั๊ม -->\n    <g id=\"pump1\"><circle cx=\"720\" cy=\"445\" r=\"16\" class=\"box\"/><path id=\"imp1\" d=\"M720 433 L726 445 L720 457 L714 445z\" fill=\"var(--teal)\"/>\n      <text class=\"sub\" x=\"720\" y=\"478\" text-anchor=\"middle\">P-1 ทำงาน<\/text><\/g>\n    <g id=\"pump2\" class=\"dim\"><circle cx=\"720\" cy=\"560\" r=\"16\" class=\"box\"/><text class=\"lbl\" x=\"720\" y=\"565\" text-anchor=\"middle\">P<\/text>\n      <text class=\"sub\" x=\"720\" y=\"592\" text-anchor=\"middle\">P-2 สำรอง<\/text><\/g>\n    <text class=\"num\" x=\"690\" y=\"410\">98 ลบ.ม./ชม. · เฮด 20 ม.<\/text>\n    <!-- ถังกรอง -->\n    <g>\n      <rect x=\"790\" y=\"218\" width=\"60\" height=\"164\" rx=\"26\" class=\"box\"/><rect x=\"882\" y=\"218\" width=\"60\" height=\"164\" rx=\"26\" class=\"box\"/>\n      <rect x=\"796\" y=\"300\" width=\"48\" height=\"70\" rx=\"6\" fill=\"var(--chip)\"/><rect x=\"888\" y=\"300\" width=\"48\" height=\"70\" rx=\"6\" fill=\"var(--chip)\"/>\n      <text class=\"lbl\" x=\"820\" y=\"262\" text-anchor=\"middle\">F-1<\/text><text class=\"lbl\" x=\"912\" y=\"262\" text-anchor=\"middle\">F-2<\/text>\n      <text class=\"num\" x=\"820\" y=\"340\" text-anchor=\"middle\">ทราย<\/text><text class=\"num\" x=\"912\" y=\"340\" text-anchor=\"middle\">ทราย<\/text>\n      <text class=\"sub\" x=\"866\" y=\"190\" text-anchor=\"middle\">ถังกรองทราย ศก. 1.60 ม. · 21 ม./ชม.<\/text>\n    <\/g>\n    <!-- UV -->\n    <g><rect x=\"990\" y=\"350\" width=\"72\" height=\"44\" rx=\"8\" class=\"box\"/><text class=\"lbl\" x=\"1026\" y=\"377\" text-anchor=\"middle\">UV<\/text>\n      <text class=\"sub\" x=\"1026\" y=\"412\" text-anchor=\"middle\">ฆ่าเชื้อยูวี<\/text><\/g>\n    <!-- HP -->\n    <g id=\"hpG\">\n      <circle class=\"hp-glow\" cx=\"1132\" cy=\"286\" r=\"70\" fill=\"url(#glow)\"/>\n      <rect x=\"1095\" y=\"258\" width=\"75\" height=\"56\" rx=\"8\" class=\"box\"/>\n      <text class=\"lbl\" x=\"1132\" y=\"284\" text-anchor=\"middle\">HP-1 HP-2<\/text>\n      <text class=\"num\" x=\"1132\" y=\"301\" text-anchor=\"middle\">2 × 15 kW<\/text>\n      <text class=\"sub\" x=\"1132\" y=\"334\" text-anchor=\"middle\">ปั๊มความร้อน<\/text>\n    <\/g>\n    <!-- CD -->\n    <g><rect x=\"1095\" y=\"150\" width=\"75\" height=\"44\" rx=\"8\" class=\"box\" style=\"stroke:var(--chem)\"/><text class=\"lbl\" x=\"1132\" y=\"170\" text-anchor=\"middle\">CD<\/text>\n      <text class=\"num\" x=\"1132\" y=\"186\" text-anchor=\"middle\">Cl + pH<\/text><\/g>\n    <!-- ระบายล้างย้อน -->\n    <g><rect x=\"1040\" y=\"584\" width=\"96\" height=\"32\" rx=\"6\" fill=\"var(--surface)\" stroke=\"var(--waste)\"/><text class=\"sub\" x=\"1088\" y=\"604\" text-anchor=\"middle\">บ่อพักน้ำเสีย<\/text><\/g>\n    <text class=\"num\" x=\"600\" y=\"62\">ท่อคืนน้ำ 5\" ไปหัวจ่ายพื้นสระ RI 8 จุด<\/text>\n\n    <!-- อุณหภูมิ -->\n    <g id=\"chips\"><\/g>\n  <\/svg>\n  <\/div>\n  <div class=\"caption\">\n    <div class=\"now\"><h3 id=\"mTitle\"><\/h3><p id=\"mText\"><\/p><\/div>\n    <div style=\"display:grid;gap:8px\">\n      <div class=\"scale\">33.2 °C <span class=\"bar\"><\/span> 33.8 °C<\/div>\n      <div class=\"legend\"><span><i style=\"background:var(--cool)\"><\/i>น้ำออกจากสระ<\/span><span><i style=\"background:var(--warm)\"><\/i>น้ำอุ่นกลับสระ<\/span><span><i style=\"background:var(--chem)\"><\/i>สารเคมี<\/span><span><i style=\"background:var(--waste)\"><\/i>น้ำล้างย้อน<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section>\n  <h2>น้ำเดินทางอย่างไรใน 1 รอบ<\/h2>\n  <p class=\"lead\">ทุก 1.5 ชั่วโมง น้ำทั้งสระ 146 ลบ.ม. ผ่านเส้นทางนี้ครบ 1 รอบ ด้วยอัตรา 98 ลบ.ม./ชม. (23 ล./วินาที)<\/p>\n  <div class=\"steps\">\n    <div class=\"step\"><span class=\"k\">ออกจากสระ<\/span><h4>รางน้ำล้นและช่องดูดก้นสระ<\/h4><p>ผิวน้ำที่มีไขมันและฝุ่นไหลข้ามขอบลงรางรอบสระ ส่วนน้ำก้นสระถูกดูดผ่าน MD 2 จุด ทั้งหมดไหลด้วยแรงโน้มถ่วงลงถังพัก<\/p><span class=\"fig\">ราง 2 × 4\" · MD 2 × 4\"<\/span><\/div>\n    <div class=\"step\"><span class=\"k\">พักน้ำ<\/span><h4>ถังพักน้ำล้น BT<\/h4><p>รับน้ำที่ล้นเมื่อมีคนลงสระ และเป็นจุดเติมน้ำประปา ระดับน้ำในถังขึ้นลงตามจำนวนผู้ใช้<\/p><span class=\"fig\">7 ลบ.ม. · รับคนลงสระพร้อมกัน 24 คน<\/span><\/div>\n    <div class=\"step\"><span class=\"k\">ดูดและส่ง<\/span><h4>ตะแกรงดักผมและปั๊ม 1+1<\/h4><p>ตะแกรงดักผมกันเศษเข้าปั๊ม ปั๊มทำงานสลับกัน 1 ตัว สำรอง 1 ตัว<\/p><span class=\"fig\">ดูด 6\" 1.3 ม./วินาที · ส่ง 5\" 1.8 ม./วินาที<\/span><\/div>\n    <div class=\"step\"><span class=\"k\">กรอง<\/span><h4>ถังกรองทราย F-1 F-2<\/h4><p>น้ำไหลจากบนลงล่างผ่านชั้นทราย ตะกอนติดค้างในทราย เมื่อแรงดันตกคร่อมสูงขึ้นให้ล้างย้อน<\/p><span class=\"fig\">พื้นที่กรอง 4.02 ตร.ม. · 21 ม./ชม. (ไม่เกิน 25)<\/span><\/div>\n    <div class=\"step\"><span class=\"k\">ฆ่าเชื้อ<\/span><h4>ยูวีและคลอรีน + ปรับ pH<\/h4><p>ยูวีฆ่าเชื้อในท่อ ส่วนชุด CD วัดค่าคลอรีนและ pH ในน้ำ แล้วเติมสารอัตโนมัติเพื่อคงคลอรีนคงเหลือในสระ<\/p><span class=\"fig\">วัด Cl pH ORP · เติมเข้าท่อคืนน้ำ<\/span><\/div>\n    <div class=\"step\"><span class=\"k\">อุ่นและคืนน้ำ<\/span><h4>ปั๊มความร้อนและหัวจ่ายพื้นสระ<\/h4><p>ปั๊มความร้อนเติมพลังงานชดเชยความร้อนที่สระเสียให้อากาศ น้ำอุ่นกลับเข้าทางพื้นสระ 8 จุด ผสมทั่วสระจากล่างขึ้นบน<\/p><span class=\"fig\">2 × 15 kW · น้ำออกอุ่นขึ้น 0.31 °C<\/span><\/div>\n  <\/div>\n  <div class=\"panel\" style=\"margin-top:14px\">\n    <strong style=\"font-size:15px\">อุณหภูมิน้ำตามเส้นทาง (ช่วงทำงานปกติ อากาศห้องสระ 28 °C)<\/strong>\n    <div class=\"track\" id=\"track\"><\/div>\n    <div class=\"tline\" id=\"tline\"><\/div>\n    <p class=\"note\">น้ำเย็นลงเล็กน้อยที่รางล้นและถังพักเพราะสัมผัสอากาศ ผ่านปั๊มและถังกรองแทบไม่เปลี่ยน แล้วอุ่นขึ้นที่ปั๊มความร้อน ความต่างอุณหภูมิในท่อมีเพียงไม่ถึง 0.5 °C เพราะน้ำไหลเร็ว 23 ล./วินาที ระบบรักษาอุณหภูมิด้วยการหมุนเวียนต่อเนื่อง ไม่ได้ต้มน้ำให้ร้อนจัด<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"panel\">\n  <h2>การอุ่นน้ำและการเปลี่ยนแปลงอุณหภูมิ<\/h2>\n  <p class=\"lead\">หลังเติมน้ำใหม่ น้ำประปาเย็นกว่าที่ต้องการ ปั๊มความร้อนใช้เวลาหลายวันอุ่นทั้งสระ เมื่อถึง 33.5 °C เทอร์โมสตัทตัดและเปิดสลับเพื่อชดเชยความร้อนที่เสียไป ปรับค่าด้านขวาเพื่อดูผล<\/p>\n  <div class=\"chartgrid\">\n    <div style=\"min-width:0;overflow-x:auto\"><svg id=\"chart\" viewBox=\"0 0 640 320\" style=\"width:100%;min-width:460px;height:auto\" role=\"img\" aria-label=\"กราฟอุณหภูมิน้ำสระ\"><\/svg><\/div>\n    <div class=\"ctl\">\n      <label for=\"tFill\">อุณหภูมิน้ำประปาที่เติม <output id=\"oFill\"><\/output><\/label>\n      <input id=\"tFill\" type=\"range\" min=\"24\" max=\"31\" step=\"0.5\" value=\"28\">\n      <label for=\"tAir\">อุณหภูมิอากาศห้องสระ <output id=\"oAir\"><\/output><\/label>\n      <input id=\"tAir\" type=\"range\" min=\"24\" max=\"32\" step=\"0.5\" value=\"28\">\n      <label for=\"nHp\">ปั๊มความร้อนที่ทำงาน <output id=\"oHp\"><\/output><\/label>\n      <input id=\"nHp\" type=\"range\" min=\"1\" max=\"2\" step=\"1\" value=\"2\">\n      <div class=\"kpis\">\n        <div class=\"kpi\"><b id=\"kTime\">–<\/b><span>เวลาอุ่นถึง 33.5 °C<\/span><\/div>\n        <div class=\"kpi\"><b id=\"kLoss\">–<\/b><span>ความร้อนที่สระเสีย<\/span><\/div>\n        <div class=\"kpi\"><b id=\"kDuty\">–<\/b><span>ปั๊มความร้อนเดิน<\/span><\/div>\n        <div class=\"kpi\"><b id=\"kRise\">–<\/b><span>น้ำอุ่นขึ้นต่อรอบที่ HP<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <p class=\"note\">แบบจำลองอย่างง่ายจากค่าในร่าง riser: ความร้อนที่สระเสีย 23.6 kW ที่น้ำ 33.5 °C อากาศ 27 °C (สัมประสิทธิ์ 3.63 kW/°C) ความจุความร้อนน้ำ 146 ลบ.ม. = 170 kWh/°C ใช้ประกอบการตรวจแนวคิดเท่านั้น ค่าออกแบบจริงอยู่ในรายการคำนวณระบบสระ<\/p>\n<\/section>\n<\/div>\n\n<script>\n(() => {\n  const svg = document.getElementById('sys');\n  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n  const hex = h => { h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.substr(i,2),16)); };\n  const mix = (a,b,t) => 'rgb(' + a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',') + ')';\n  function tColor(t){\n    const lo=33.2, mid=33.5, hi=33.8; const c=hex(css('--cool')), w=hex(css('--warm')), h=hex(css('--hot'));\n    if (t<=mid) return mix(c,w,Math.max(0,(t-lo)/(mid-lo)));\n    return mix(w,h,Math.min(1,(t-mid)/(hi-mid)));\n  }\n  const flows=[...svg.querySelectorAll('.flow')];\n  function paint(){ flows.forEach(f=>{ f.style.stroke = f.dataset.c || tColor(parseFloat(f.dataset.t)); }); drawChips(); drawTline(); }\n\n  const MODES={\n    run:{on:['over','md','suc','p1','dis','fout','uv','hp','ret','cd'],heat:true,bt:470,bath:0,speed:1,\n      t:'กรองหมุนเวียน + อุ่นน้ำ',d:'โหมดปกติ น้ำล้นรางและน้ำก้นสระไหลลงถังพัก ปั๊ม P-1 ดูดผ่านตะแกรงดักผม ส่งผ่านถังกรองทราย ยูวี และปั๊มความร้อน แล้วกลับเข้าสระทางพื้น ชุด CD เติมคลอรีนและปรับ pH ตามค่าที่วัดได้'},\n    bathers:{on:['over','md','suc','p1','dis','fout','uv','hp','ret','cd'],heat:true,bt:420,bath:1,speed:1.6,\n      t:'มีผู้ใช้ลงสระ',d:'ผู้ใช้แทนที่น้ำ ผิวน้ำยกขึ้นและล้นลงรางมากขึ้น ระดับน้ำในถังพัก BT สูงขึ้นเพื่อเก็บน้ำส่วนนี้ไว้ เมื่อผู้ใช้ขึ้นจากสระ ปั๊มคืนน้ำกลับจนระดับเท่าเดิม ถัง 7 ลบ.ม. รับผู้ใช้พร้อมกันได้ 24 คน'},\n    makeup:{on:['mk','over','md','suc','p1','dis','fout','uv','hp','ret'],heat:true,bt:505,bath:0,speed:1,\n      t:'เติมน้ำ',d:'เมื่อระดับในถังพักต่ำ (น้ำระเหย น้ำติดตัวผู้ใช้ หรือหลังล้างย้อน) ลูกลอยเปิดให้น้ำประปา 1\" ไหลลงถังพักผ่านช่องว่างอากาศ กันน้ำสระย้อนเข้าระบบประปา น้ำใหม่เย็นกว่า ปั๊มความร้อนจึงทำงานนานขึ้น'},\n    backwash:{on:['suc','p1','bwin','bwd','bw'],heat:false,bt:490,bath:0,speed:1.3,\n      t:'ล้างย้อนถังกรอง',d:'เมื่อแรงดันตกคร่อมถังกรองสูง ตั้งวาล์วหลายทางเป็นล้างย้อน น้ำไหลกลับทางจากล่างขึ้นบน ยกชั้นทรายพาตะกอนออกทางท่อ 4\" ลงบ่อพักน้ำเสียผ่านช่องว่างอากาศ ล้างทีละถัง ช่วงนี้หยุดคืนน้ำเข้าสระและหยุดปั๊มความร้อน'},\n    idle:{on:[],heat:false,bt:445,bath:0,speed:1,\n      t:'ปั๊มหยุด',d:'เมื่อปั๊มหยุด น้ำในท่อและรางไหลลงถังพักจนระดับสูงขึ้น ปั๊มความร้อนต้องหยุดตามเพราะไม่มีน้ำไหลผ่าน ระบบควบคุมจึงล็อกให้ฮีตปั๊มเดินได้เฉพาะเมื่อปั๊มหมุนเวียนทำงาน'}\n  };\n  const lenCache=new Map();\n  function setMode(k){\n    const m=MODES[k];\n    document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mode===k));\n    flows.forEach(f=>{\n      const on=m.on.includes(f.dataset.k); f.classList.toggle('on',on);\n      if(!lenCache.has(f)) lenCache.set(f,f.getTotalLength());\n      const L=lenCache.get(f); f.style.setProperty('--dur', (Math.max(0.6, L/220)/m.speed).toFixed(2)+'s');\n    });\n    svg.classList.toggle('heat', m.heat);\n    const bw=document.getElementById('btWater'); bw.setAttribute('y', m.bt); bw.setAttribute('height', 587-m.bt);\n    document.getElementById('bathers').setAttribute('opacity', m.bath);\n    document.getElementById('pump1').classList.toggle('dim', m.on.length===0);\n    document.getElementById('mTitle').textContent=m.t; document.getElementById('mText').textContent=m.d;\n    const imp=document.getElementById('imp1');\n    imp.style.transformOrigin='720px 445px'; imp.style.transformBox='view-box';\n    imp.animate ? (imp._a && imp._a.cancel(), m.on.length && !matchMedia('(prefers-reduced-motion: reduce)').matches && (imp._a=imp.animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:900/m.speed,iterations:Infinity}))) : 0;\n  }\n  document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));\n\n  const CHIPS=[[220,350,'สระ',33.5],[432,330,'ราง',33.3],[516,470,'BT',33.3],[820,410,'กรอง',33.32],[1026,440,'ยูวี',33.32],[1132,236,'HP ออก',33.63]];\n  function drawChips(){\n    const g=document.getElementById('chips'); g.innerHTML='';\n    CHIPS.forEach(([x,y,n,t],i)=>{\n      if(i===0||i===2) return;\n      const c=document.createElementNS('http://www.w3.org/2000/svg','g'); c.setAttribute('class','chipT');\n      const w=74; c.innerHTML=`<rect x=\"${x-w/2}\" y=\"${y-12}\" width=\"${w}\" height=\"22\" rx=\"11\"/><circle cx=\"${x-w/2+11}\" cy=\"${y-1}\" r=\"5\" fill=\"${tColor(t)}\"/><text x=\"${x+6}\" y=\"${y+3}\" text-anchor=\"middle\" fill=\"${tColor(t)}\">${t.toFixed(2)}°<\/text>`;\n      g.appendChild(c);\n    });\n  }\n  function drawTline(){\n    const el=document.getElementById('tline');\n    const pts=[['ในสระ',33.5],['รางน้ำล้น',33.3],['ถังพัก BT',33.3],['หลังกรอง',33.32],['หลังยูวี',33.32],['ออกจาก HP',33.63]];\n    el.innerHTML=pts.map(([n,t])=>`<div class=\"tnode\"><b style=\"color:${t function toSvg(cx,cy){const r=svg.getBoundingClientRect();const s=Math.max(vb[2]/r.width,vb[3]/r.height);const ox=(r.width*s-vb[2])/2,oy=(r.height*s-vb[3])/2;return [vb[0]-ox+(cx-r.left)*s,vb[1]-oy+(cy-r.top)*s];}
function zoomAt(f,cx,cy){cancelAnimationFrame(anim);const p=toSvg(cx,cy);const nw=vb[2]/f,nh=vb[3]/f;const minW=FULL[2]/40,maxW=FULL[2]*1.6;if(nw<minW||nw>maxW)return;vb=[p[0]-(p[0]-vb[0])/f,p[1]-(p[1]-vb[1])/f,nw,nh];svg.setAttribute('viewBox',vb.join(' '));}
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*0.0016),e.clientX,e.clientY);},{passive:false});
const ptrs=new Map();let last=null,pinch0=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.eq'))return;svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);svg.classList.add('drag');last=[e.clientX,e.clientY];if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]);}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch0){zoomAt(d/pinch0,(a[0]+b[0])/2,(a[1]+b[1])/2);}pinch0=d;return;}
  const p0=toSvg(last[0],last[1]),p1=toSvg(e.clientX,e.clientY);vb[0]-=p1[0]-p0[0];vb[1]-=p1[1]-p0[1];svg.setAttribute('viewBox',vb.join(' '));last=[e.clientX,e.clientY];});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;if(!ptrs.size)svg.classList.remove('drag');else last=[...ptrs.values()][0];};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
const ctr=()=>{const r=svg.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};

// ---------- ป้ายขนาดท่อเมื่อซูมเข้า (ลูกศรชี้ 45° แล้วแนวนอน) ----------

const mkl=el('marker',{id:'ahL',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse',markerUnits:'userSpaceOnUse'},defs);el('path',{d:'M0 0L10 5L0 10z',fill:'#d2342a'},mkl);
let labRaf=0;
function updLabels(){cancelAnimationFrame(labRaf);labRaf=requestAnimationFrame(()=>{
  LL.replaceChildren();const r=svg.getBoundingClientRect();if(!r.width)return;
  const base=(VIEWS[CV[0][0]]||FULL)[2];document.getElementById('zPct').textContent=Math.round(base/vb[2]*100)+'%';
  const z=base/vb[2];if(z<7)return;                        // ป้ายขนาดท่อเริ่มที่ 700%                       // แสดงเมื่อซูมเข้าตั้งแต่ 4 เท่า
  const k=Math.max(vb[2]/r.width,vb[3]/r.height);              // หน่วย svg ต่อ 1 พิกเซลจอ
  mkl.setAttribute('markerWidth',7*k);mkl.setAttribute('markerHeight',7*k);
  const fs=11.5*k,dx=16*k,hl=10*k,boxes=[],cv=cover.getAttribute('width')>0?[+cover.getAttribute('x'),+cover.getAttribute('y'),+cover.getAttribute('width'),+cover.getAttribute('height')]:null;
  const vis=PLAB.filter(q=>!q.lay.classList.contains('off')&&q.x>vb[0]&&q.x<vb[0]+vb[2]&&q.y>vb[1]&&q.y<vb[1]+vb[3]&&q.L>30*k&&!(cv&&q.x>cv[0]&&q.x<cv[0]+cv[2]))
    .sort((a,b)=>b.L-a.L).slice(0,60);
  vis.forEach(q=>{const tw=Math.max(q.t[0].length,q.t[1].length)*fs*.5,th=fs*2.5;
    for(const [sx,sy] of [[1,-1],[-1,-1],[1,1],[-1,1]]){
      const ex=q.x+sx*dx,ey=q.y+sy*dx,hx=ex+sx*hl,bx=sx>0?hx+2*k:hx-2*k-tw,by=ey-th*.62;
      const B=[bx-2*k,by-2*k,tw+4*k,th+4*k];
      if(boxes.some(o=>B[0]<o[0]+o[2]&&B[0]+B[2]>o[0]&&B[1]<o[1]+o[3]&&B[1]+B[3]>o[1]))continue;
      boxes.push(B);
      el('path',{d:`M${hx} ${ey} L${ex} ${ey} L${q.x} ${q.y}`,fill:'none',stroke:'#d2342a','stroke-width':1.1*k,'marker-end':'url(#ahL)'},LL);
      el('rect',{x:B[0],y:B[1],width:B[2],height:B[3],rx:3*k,fill:'var(--paper)',opacity:.92,stroke:q.col,'stroke-width':.8*k},LL);
      const t=el('text',{x:sx>0?bx:bx+tw,y:by+fs*.95,'text-anchor':sx>0?'start':'end','font-size':fs,'font-weight':600,fill:'var(--ink)'},LL);t.textContent=q.t[0];
      const t2=el('text',{x:sx>0?bx:bx+tw,y:by+fs*2.15,'text-anchor':sx>0?'start':'end','font-size':fs*.88,fill:'var(--muted)'},LL);t2.textContent=q.t[1];
      break;}});
});}

if(D.side){const host=document.getElementById('secs');const card=document.createElement('div');card.className='sec';
  card.innerHTML='<h3>Side overview system · Hydro pool</h3><p>แผนภาพการไหลด้านข้างของระบบสระวารีบำบัด เลือกโหมดการทำงานและดูอุณหภูมิน้ำแต่ละช่วง</p>';
  const f=document.createElement('iframe');f.title='Side overview system Hydro pool';f.style.cssText='width:100%;border:0;display:block;height:900px;border-radius:10px;background:transparent';f.srcdoc=D.side;
  const fit=()=>{try{const d=f.contentDocument;if(d&&d.body){f.style.height=Math.max(600,d.documentElement.scrollHeight)+'px';}}catch(e){}};

// ---------- รูปตัดแผนภาพระบบ (riser) แยกอาคาร ----------
const SECG=[];
(function(){const host=document.getElementById('secs');if(!D.sec)return;
 const SYSK={cw:'cw',fx:'cw',tank:'cw',pump:'cw',drS:'dr',drW:'dr',drE:'dr',v:'dr',mh:'dr',st:'dr',rd:'rd',rc:'rd',cb:'rd',
   pool:'pool',warm:'pool',chem:'pool',water:'pool',gut:'pool',bt:'pool',flt:'pool',uv:'pool',hp:'pool',cd:'pool',ri:'pool',md:'pool'};
 const COL={cw:'var(--cw)',drS:'var(--s)',drW:'var(--w)',drE:'var(--s)',v:'var(--v)',rd:'var(--rd)',rc:'var(--conc)',pool:'var(--pool)',warm:'var(--warm)',chem:'var(--chem)'};
 const FILL={tank:['var(--tank1)','var(--tankE)'],pump:['var(--metal1)','var(--metalE)'],mh:['var(--paper)','var(--s)'],st:['var(--tank1)','var(--s)'],cb:['var(--coping)','var(--copingE)'],
   water:['url(#gWater)','var(--poolE)'],gut:['var(--coping)','var(--copingE)'],bt:['var(--water)','var(--pool)'],flt:['var(--dome1)','var(--metalE)'],uv:['var(--metal1)','var(--metalE)'],
   hp:['var(--metal1)','var(--metalE)'],cd:['var(--paper)','var(--chem)'],md:['var(--ink)','var(--ink)'],slab:['var(--arw)','none'],roof:['var(--ar)','var(--arw)']};
 D.sec.forEach(sc=>{const SX=22,SZ=46,X0=sc.x[0],Z1=sc.z[1],W=(sc.x[1]-sc.x[0])*SX,H=(sc.z[1]-sc.z[0])*SZ;
  const P=(x,z)=>[((x-X0)*SX).toFixed(1),((Z1-z)*SZ).toFixed(1)];
  const card=document.createElement('div');card.className='sec';card.innerHTML=`<h3>รูปตัดแผนภาพระบบ (riser diagram) · ${sc.name}</h3><p>ฉายแนวท่อจริงจากแปลนลงระนาบรูปตัด แกนนอนตามแนวกริดของแปลน แกนตั้งตามระดับ (ขยายแกนตั้ง ${(SZ/SX).toFixed(1)} เท่า) วางเมาส์บนท่อเพื่อดูชนิดและขนาด</p>`;host.appendChild(card);
  const sv=document.createElementNS(NS,'svg');sv.setAttribute('viewBox',`0 0 ${W} ${H}`);card.appendChild(sv);
  const G={};['base','cw','dr','rd','pool'].forEach(k=>{G[k]=el('g',{},sv);});G.base.dataset.s='base';
  const grp=k=>G[SYSK[k]]||G.base;
  sc.E.forEach(e=>{
   if(e.t==='r'){const a=P(e.b[0],e.b[3]),b=P(e.b[2],e.b[1]);const f=FILL[e.k]||['var(--paper)','var(--muted)'];
     el('rect',{x:a[0],y:a[1],width:Math.max(1,b[0]-a[0]),height:Math.max(1,b[1]-a[1]),rx:e.rr||0,fill:f[0],stroke:f[1],'stroke-width':1},grp(e.k));}
   else if(e.t==='c'){const a=P(e.x,e.z);el('circle',{cx:a[0],cy:a[1],r:e.r,fill:e.k==='ri'?'var(--warm)':'var(--paper)',stroke:e.k==='ri'?'var(--paper)':'var(--cw)','stroke-width':1},grp(e.k));}
   else if(e.t==='t'){const a=P(e.x,e.z);const sy=e.k.startsWith('lab-')?e.k.slice(4):'base';
     const t=el('text',{x:a[0],y:+a[1]+(e.dy||0),'text-anchor':e.a,'font-size':e.k==='lv'?10:(sy==='cw'&&e.s.length<5?7.5:10.5),fill:e.k==='lv'?'var(--muted)':'var(--ink)','font-weight':e.k==='lv'?400:600,'paint-order':'stroke',stroke:'var(--paper)','stroke-width':3},G[sy]||G.base);t.textContent=e.s;}
   else if(e.t==='l'){const d='M'+e.p.map(q=>P(q[0],q[1]).join(' ')).join(' L');
     if(e.k==='lv'||e.k==='gnd'||e.k==='wall'){el('path',{d,fill:'none',stroke:e.k==='wall'?'var(--arw)':e.k==='gnd'?'var(--muted)':'var(--line)','stroke-width':e.w,'stroke-dasharray':e.d||null},G.base);return;}
     const g=grp(e.k),c=COL[e.k]||'var(--ink)';
     el('path',{d,fill:'none',stroke:'var(--pipeE)','stroke-width':e.w+1,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':e.d||null},g);
     el('path',{d,fill:'none',stroke:c,'stroke-width':e.w,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':e.d||null},g);
     e.p.slice(1,-1).forEach(q=>{const a=P(q[0],q[1]);el('circle',{cx:a[0],cy:a[1],r:e.w*.68,fill:c,stroke:'var(--pipeE)','stroke-width':.5},g);});
     if(e.k!=='v'){const f=el('path',{d,class:'flow','stroke-width':Math.max(.5,e.w*.32)},g);f.style.setProperty('--dur','2.4s');}
     if(e.lab){const h=el('path',{d,class:'hit','stroke-width':Math.max(8,e.w+6)},g);const ti=document.createElementNS(NS,'title');ti.textContent=e.lab;h.appendChild(ti);}}
  });
  SECG.push(G);});})();
function updSecs(){const sh={pool:sys==='pool'||sys==='all',cw:sys==='cw'||sys==='all',dr:sys==='dr'||sys==='all',rd:sys==='rd'||sys==='all'};
